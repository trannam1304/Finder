$kind: http-request
url: "{{baseUrl}}/api/itinerary_reroll.php?current_id=1&from_lat=10.7326&from_lng=106.6996&place_type=food&vibe=chill&radius=5"
method: GET
headers:
  Accept: application/json
queryParams:
  current_id: "1"
  from_lat: "10.7326"
  from_lng: "106.6996"
  place_type: food
  vibe: chill
  radius: "5"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code là 200 OK", function () {
          pm.response.to.have.status(200);
      });
      pm.test("Trả về chặng thay thế khác ID ban đầu", function () {
          var json = pm.response.json();
          pm.expect(json.success).to.be.true;
          pm.expect(json.data.place.id).to.not.eql(1);
      });
    language: text/javascript
order: 4000

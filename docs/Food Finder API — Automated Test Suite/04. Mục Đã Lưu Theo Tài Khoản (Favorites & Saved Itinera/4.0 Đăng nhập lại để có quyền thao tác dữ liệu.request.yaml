$kind: http-request
name: 4.0 Đăng nhập lại để có quyền thao tác dữ liệu User
url: "{{baseUrl}}/api/auth/login.php"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
body:
  type: json
  content: |-
    {
        "identifier": "{{test_username}}",
        "password": "{{test_password}}"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Đăng nhập thành công", function () {
          pm.response.to.have.status(200);
          var json = pm.response.json();
          if (json.data && json.data.access_token) {
              pm.environment.set("access_token", json.data.access_token);
          }
      });
    language: text/javascript
order: 1000

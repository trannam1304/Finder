$kind: http-request
name: 2.5 Lọc riêng nhóm Vui chơi giải trí (type=entertainment)
url: "{{baseUrl}}/api/restaurants.php?lat=10.7326&lng=106.6996&radius=10&type=entertainment"
method: GET
headers:
  Accept: application/json
queryParams:
  lat: "10.7326"
  lng: "106.6996"
  radius: "10"
  type: entertainment
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code là 200 OK", function () {
          pm.response.to.have.status(200);
      });
      pm.test("Có ít nhất 10 điểm vui chơi giải trí", function () {
          var json = pm.response.json();
          pm.expect(json.success).to.be.true;
          pm.expect(json.data.length).to.be.at.least(10);
      });
    language: text/javascript
order: 5000

  <div class="explore-layout">

    <!-- ── Filter sidebar ── -->
    <aside class="explore-filters" id="explore-filters" aria-label="Bộ lọc quán ăn">

      <!-- Category -->
      <div class="filter-section">
        <h2 class="filter-section__title">Danh mục</h2>
        <div id="filter-categories">
          <!-- Rendered by JS -->
        </div>
      </div>

      <!-- Price level -->
      <div class="filter-section">
        <h2 class="filter-section__title">Mức giá</h2>
        <label class="filter-option">
          <input type="checkbox" id="price-1" name="price" value="1">
          <span>Bình dân (dưới 50k)</span>
          <span class="filter-option__count" id="count-price-1">—</span>
        </label>
        <label class="filter-option">
          <input type="checkbox" id="price-2" name="price" value="2">
          <span>Trung bình (50–150k)</span>
          <span class="filter-option__count" id="count-price-2">—</span>
        </label>
        <label class="filter-option">
          <input type="checkbox" id="price-3" name="price" value="3">
          <span>Cao cấp (trên 150k)</span>
          <span class="filter-option__count" id="count-price-3">—</span>
        </label>
      </div>

      <!-- Rating -->
      <div class="filter-section">
        <h2 class="filter-section__title">Đánh giá tối thiểu</h2>
        <label class="filter-option">
          <input type="radio" name="rating" value="0" checked> Tất cả
        </label>
        <label class="filter-option">
          <input type="radio" name="rating" value="4">
          <svg class="ui-icon ui-icon--star ui-icon--star-filled" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" aria-hidden="true"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
          <span>4.0+</span>
        </label>
        <label class="filter-option">
          <input type="radio" name="rating" value="4.3">
          <svg class="ui-icon ui-icon--star ui-icon--star-filled" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" aria-hidden="true"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
          <span>4.3+</span>
        </label>
        <label class="filter-option">
          <input type="radio" name="rating" value="4.5">
          <svg class="ui-icon ui-icon--star ui-icon--star-filled" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" aria-hidden="true"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
          <span>4.5+</span>
        </label>
      </div>

      <!-- Open now -->
      <div class="filter-section">
        <h2 class="filter-section__title">Trạng thái</h2>
        <label class="filter-option">
          <input type="checkbox" id="filter-open-now">
          <span>Đang mở cửa</span>
        </label>
      </div>

      <!-- Reset -->
      <button class="btn btn--ghost btn--sm" id="btn-reset-filters" style="width:100%;margin-top:var(--sp-2)">
        Xóa bộ lọc
      </button>
    </aside>

    <!-- ── Main grid ── -->
    <main class="explore-main" id="explore-main">

      <!-- FE-01: Thanh Tabs Phân Loại Cấp 1 -->
      <div class="explore-type-tabs-wrap">

            <span>Tất cả</span>
          </button>
          <button class="type-tab type-tab--food" type="button" role="tab" data-type="food" aria-selected="false" title="Ẩm thực, Quán ăn, Cà phê">
            <span>🍽️ Ẩm thực</span>
          </button>
          <button class="type-tab type-tab--tourism" type="button" role="tab" data-type="tourism" aria-selected="false" title="Du lịch, Bảo tàng, Di tích, Check-in">
            <span>🏛️ Du lịch</span>
          </button>
          <button class="type-tab type-tab--entertainment" type="button" role="tab" data-type="entertainment" aria-selected="false" title="Vui chơi giải trí, Thể thao, Rạp phim">

          </button>
        </div>

            class="explore-search"

            aria-label="Tìm kiếm quán ăn"
            autocomplete="off"
          >
        </div>

        <select class="explore-sort" id="explore-sort" aria-label="Sắp xếp theo">
          <option value="rating">Đánh giá cao nhất</option>
          <option value="name">Tên A–Z</option>
          <option value="price_asc">Giá thấp → cao</option>
          <option value="price_desc">Giá cao → thấp</option>
          <option value="reviews">Nhiều đánh giá nhất</option>
        </select>

        <span class="explore-count" id="explore-count" aria-live="polite">—</span>

        <button class="explore-filter-toggle" id="btn-filter-toggle" aria-label="Mở bộ lọc" aria-expanded="false" aria-controls="explore-filters">
          <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 16 16" aria-hidden="true">
            <path d="M2 4h12M4 8h8M6 12h4"/>
          </svg>
          Bộ lọc
        </button>

      <div class="resto-grid" id="resto-grid" role="list" aria-label="Danh sách quán ăn">
        <!-- Rendered by JS -->
      </div>

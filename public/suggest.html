  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"

  <script>
    // Theme toggle
    const btnTheme = document.getElementById('btn-theme');
    const root = document.documentElement;
    function applyTheme(theme) {
      root.dataset.theme = theme;
      if (btnTheme) btnTheme.innerHTML = theme === 'dark'
        ? '<svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>'
        : '<svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M20.5 15.2A8.6 8.6 0 0 1 8.8 3.5 8.7 8.7 0 1 0 20.5 15.2Z"/></svg>';
      localStorage.setItem('ff-theme', theme);
    }
    const savedTheme = localStorage.getItem('ff-theme') ||
      (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    applyTheme(savedTheme);
    if (btnTheme) btnTheme.addEventListener('click', () => {
      applyTheme(root.dataset.theme === 'dark' ? 'light' : 'dark');
    });

    // Tự động chọn danh mục mặc định theo loại hình địa điểm
    const placeTypeSelect = document.getElementById('sug-place-type');
    const categorySelect = document.getElementById('sug-category');
    placeTypeSelect?.addEventListener('change', () => {
      const selectedGroup = placeTypeSelect.value;
      const firstMatch = categorySelect.querySelector(`option[data-group="${selectedGroup}"]`);
      if (firstMatch) categorySelect.value = firstMatch.value;
    });

    // Toast
    function showToast(msg) {
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');
      toast.style.cssText = `
        background:var(--c-surface);color:var(--c-ink);
        border:1px solid var(--c-border);border-left:4px solid var(--c-primary);
        padding:var(--sp-3) var(--sp-4);border-radius:var(--r-md);
        box-shadow:var(--sh-2);font-size:var(--fs-sm);margin-bottom:var(--sp-2);
      `;
      toast.textContent = msg;
      container.appendChild(toast);
      setTimeout(() => toast.remove(), 4000);
    }

    // Leaflet map setup
    let defaultLat = 10.7326;
    let defaultLng = 106.6996;
    const map = L.map('suggest-map', {
      center: [defaultLat, defaultLng],
      zoom: 15,
      zoomControl: true,
      attributionControl: false
    });

    const tileLayer = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19
    }).addTo(map);
    tileLayer.on('load', () => { window.__tilesLoaded = true; });

    let marker = L.marker([defaultLat, defaultLng], { draggable: true }).addTo(map);

    function updateCoords(lat, lng) {
      document.getElementById('sug-lat').value = Number(lat).toFixed(6);
      document.getElementById('sug-lng').value = Number(lng).toFixed(6);
    }

    marker.on('dragend', function(e) {
      const pos = e.target.getLatLng();
      updateCoords(pos.lat, pos.lng);
    });

    map.on('click', function(e) {
      marker.setLatLng(e.latlng);
      updateCoords(e.latlng.lat, e.latlng.lng);
    });

    // Form submit
    document.getElementById('suggest-form').addEventListener('submit', function(e) {
      e.preventDefault();
      const suggestion = {
        name: document.getElementById('sug-name').value,
        place_type: document.getElementById('sug-place-type').value,
        category_id: document.getElementById('sug-category').value,
        address: document.getElementById('sug-address').value,
        phone: document.getElementById('sug-phone').value,
        price_min: document.getElementById('sug-price-min').value,
        price_max: document.getElementById('sug-price-max').value,
        ticket_price: document.getElementById('sug-ticket-price').value,
        estimated_duration: document.getElementById('sug-duration').value,
        open_time: document.getElementById('sug-open').value,
        close_time: document.getElementById('sug-close').value,
        lat: document.getElementById('sug-lat').value,
        lng: document.getElementById('sug-lng').value,
        note: document.getElementById('sug-note').value,
        created_at: new Date().toISOString()
      };

      try {
        const list = JSON.parse(localStorage.getItem('food_finder_suggestions') || '[]');
        list.push(suggestion);
        localStorage.setItem('food_finder_suggestions', JSON.stringify(list));
      } catch (_) {}

      showToast('🎉 Cảm ơn bạn! Đề xuất địa điểm đã được gửi thành công đến hệ thống.');
      this.reset();
      updateCoords(defaultLat, defaultLng);
      marker.setLatLng([defaultLat, defaultLng]);
    });
  </script>
